<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — JusTraduz</title>
  <link rel="icon" href="assets/img/logo.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo"><a href="index.html"><img src="assets/img/logo.png" alt="JusTraduz" /></a></div>
      <h1>Bem-vindo de volta</h1>
      <p class="subtitle">Entre com suas credenciais para continuar</p>

      <form action="backend/public/index.php/login" method="post"></form>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="voce@exemplo.com" required />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" required />
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; font-size:14px;">
          <label style="display:flex; gap:6px; align-items:center; color:var(--text-muted);">
            <input type="checkbox" /> Lembrar de mim
          </label>
          <a href="#">Esqueci a senha</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <p class="auth-footer">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
      </p>
    </div>
  </div>

</body>
</html>
