<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão | JusTraduz</title>
  <link rel="icon" href="assets/img/icon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#008f80">
  <meta name="application-name" content="JusTraduz">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JusTraduz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-TileColor" content="#008f80">
  <style>
    :root {
      color: #102033;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7fcfc;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 440px);
      text-align: center;
    }

    img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 22px;
      color: #536173;
      font-size: 16px;
      line-height: 1.55;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      background: #008f80;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
  <script src="assets/js/pwa.js" defer></script>
  <script src="assets/js/offline.js" defer></script>
</head>
<body>
  <main>
    <img src="assets/img/app-mark.png" alt="JusTraduz">
    <h1>Você está sem conexão</h1>
    <p>O JusTraduz precisa de internet para carregar dados, documentos, mensagens e atendimentos. Verifique sua conexão e tente novamente.</p>
    <button type="button" data-reload-page>Tentar novamente</button>
  </main>
</body>
</html>
