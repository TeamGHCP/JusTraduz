<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha | JusTraduz</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <a class="auth-brand" href="index.html"><img src="assets/img/logo.png" alt="JusTraduz"></a>
      <div class="auth-card">
        <h1>Recuperar senha</h1>
        <p class="subtitle">Informe seu e-mail para receber as instruções quando o backend de recuperação estiver ativo.</p>
        <form class="auth-form" action="#" method="post">
          <div class="field">
            <label for="email">E-mail</label>
            <input class="input" type="email" id="email" name="email" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit">Enviar instruções</button>
        </form>
        <p class="auth-footer"><a href="login.html">Voltar para login</a></p>
      </div>
    </section>
    <aside class="auth-art">
      <div class="auth-art-inner">
        <div class="auth-art-logo"><img src="assets/img/logo.png" alt="JusTraduz"></div>
        <h2>Acesso seguro ao seu histórico jurídico.</h2>
        <p>A recuperação de senha será integrada ao backend com validação e expiração de token.</p>
      </div>
    </aside>
  </main>
</body>
</html>
