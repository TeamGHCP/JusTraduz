<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar Senha — JusTraduz</title>
  <link rel="icon" href="assets/img/logo.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo"><a href="index.html"><img src="assets/img/logo.png" alt="JusTraduz" /></a></div>
      <h1>Recuperar senha</h1>
      <p class="subtitle">Informe seu e-mail e enviaremos um link para redefinir sua senha.</p>

      <div class="alert alert-info">Verifique também a caixa de spam após o envio.</div>

      <form action="#" method="post">
        <div class="form-group">
          <label for="email">E-mail cadastrado</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enviar link de recuperação</button>
      </form>

      <div class="auth-footer">
        Lembrou sua senha? <a href="login.html">Voltar ao login</a>
      </div>
    </div>
  </div>
</body>
</html>
