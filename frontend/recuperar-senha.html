<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha | JusTraduz</title>
  <link rel="icon" href="assets/img/icon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/css/style.css?v=theme-slow-3">
  <link rel="stylesheet" href="assets/css/auth-novo.css?v=12">
</head>
<body>
  <main class="auth-page auth-switch-page auth-reset-page">
    <section class="auth-panel auth-login-panel">
      <a class="auth-brand login-brand" href="index.html"><img src="assets/img/logo.png" alt="JusTraduz"></a>
      <div class="auth-card">
        <h1>Recuperar senha</h1>
        <p class="subtitle">Receba um código por e-mail e valide antes de criar uma nova senha.</p>

        <form class="auth-form" action="../backend/public/index.php?rota=/auth/reset-password" method="post">
          <input type="hidden" name="acao" value="request_code">
          <div class="alert" data-auth-alert role="alert" aria-live="assertive" aria-atomic="true"></div>
          <div class="field">
            <label for="email_solicitar">E-mail</label>
            <input class="input" type="email" id="email_solicitar" name="email" autocomplete="email" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit" data-loading-text="Enviando...">Enviar código</button>
        </form>

        <form class="auth-form" action="../backend/public/index.php?rota=/auth/reset-password" method="post">
          <input type="hidden" name="acao" value="confirm_code">
          <div class="field">
            <label for="email_confirmar">E-mail</label>
            <input class="input" type="email" id="email_confirmar" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="codigo">Código recebido</label>
            <input class="input" type="text" id="codigo" name="codigo" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="senha">Nova senha</label>
              <input class="input" type="password" id="senha" name="senha" minlength="6" autocomplete="new-password" required>
            </div>
            <div class="field">
              <label for="senha2">Confirmar senha</label>
              <input class="input" type="password" id="senha2" name="senha2" minlength="6" autocomplete="new-password" required>
            </div>
          </div>
          <button class="btn btn-primary btn-block" type="submit" data-loading-text="Atualizando...">Validar código e atualizar senha</button>
        </form>
        <p class="auth-footer"><a href="login.html">Voltar para login</a></p>
      </div>
    </section>
    <aside class="auth-art auth-slider" aria-label="JusTraduz">
      <div class="auth-art-inner">
        <a href="index.html" class="slider-logo-link">
          <img class="slider-logo" src="assets/img/logo.png" alt="JusTraduz">
        </a>
        <h2>Acesse sem perder o controle.</h2>
        <p>Documentos, solicitações, agenda e atendimento ficam no mesmo fluxo.</p>
      </div>
    </aside>
  </main>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/accessibility.js?v=2026.06.16-a11y-stack-7"></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    if (!window.JusTraduzVlibrasStarted && window.VLibras && window.VLibras.Widget) {
      window.JusTraduzVlibrasStarted = true;
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    }
  </script>
</body>
</html>
