<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meu Perfil — JusTraduz</title>
  <link rel="icon" href="assets/img/logo.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="dash">
    <aside class="sidebar">
      <div class="brand"><img src="assets/img/logo.png" alt="JusTraduz" /></div>
      <h4>Menu</h4>
      <ul>
        <li><a href="dashboard-cliente.html">🏠 Início</a></li>
        <li><a href="dashboard-cliente.html">📤 Enviar Documento</a></li>
        <li><a href="solicitar-ajuda.html">🆘 Solicitar ajuda</a></li>
        <li><a href="chat.html">💬 Conversas</a></li>
      </ul>
      <h4>Conta</h4>
      <ul>
        <li><a href="perfil.html" class="active">⚙️ Meu Perfil</a></li>
        <li><a href="../backend/public/index.php?rota=/auth/logout">🚪 Sair</a></li>
      </ul>
    </aside>

    <main class="dash-main">
      <div class="dash-header">
        <h1>Meu Perfil</h1>
        <div class="user"><span>Cliente</span><div class="avatar">M</div></div>
      </div>

      <div class="profile-grid">
        <div class="card profile-side">
          <div class="profile-avatar">M</div>
          <h3 style="color:var(--navy)">Maria Silva</h3>
          <p class="card-sub">maria@email.com</p>
          <button class="btn btn-outline btn-sm" style="margin-top:14px">Trocar foto</button>
        </div>

        <div class="card">
          <h3 class="card-title">Dados pessoais</h3>
          <p class="card-sub" style="margin-bottom:18px">Mantenha suas informações sempre atualizadas.</p>
          <form action="#" method="post">
            <div class="grid grid-2">
              <div class="form-group">
                <label>Nome completo</label>
                <input type="text" class="form-control" value="Maria Silva" />
              </div>
              <div class="form-group">
                <label>CPF</label>
                <input type="text" class="form-control" value="000.000.000-00" />
              </div>
              <div class="form-group">
                <label>E-mail</label>
                <input type="email" class="form-control" value="maria@email.com" />
              </div>
              <div class="form-group">
                <label>Telefone</label>
                <input type="tel" class="form-control" value="(11) 99999-9999" />
              </div>
            </div>

            <h3 class="card-title" style="margin-top:14px">Alterar senha</h3>
            <div class="grid grid-2">
              <div class="form-group">
                <label>Senha atual</label>
                <input type="password" class="form-control" placeholder="••••••••" />
              </div>
              <div class="form-group">
                <label>Nova senha</label>
                <input type="password" class="form-control" placeholder="••••••••" />
              </div>
            </div>

            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px">
              <button type="button" class="btn btn-ghost">Cancelar</button>
              <button type="submit" class="btn btn-primary">Salvar alterações</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
