<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro — JusTraduz</title>
  <link rel="icon" href="assets/img/logo.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card" style="max-width:520px;">

      <div class="logo">
        <a href="index.html"><img src="assets/img/logo.png" alt="JusTraduz" /></a>
      </div>

      <h1>Crie sua conta</h1>
      <p class="subtitle">Comece a entender seus documentos hoje mesmo</p>

      <form action="../backend/public/index.php?rota=/auth/registrar" method="post">

        <div class="form-group">
          <label for="tipo">Tipo de conta</label>
          <select id="tipo" name="tipo" class="form-control" onchange="toggleOab()">
            <option value="cliente">Cliente (usuário comum)</option>
            <option value="advogado">Advogado</option>
            <option value="estagiario">Estagiário</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" class="form-control" required />
        </div>

        <div id="oab-block" style="display:none;">
          <div class="row" style="gap:14px;">
            <div class="form-group" style="flex:1;">
              <label for="inscricao">Número da OAB</label>
              <input type="text" id="inscricao" name="inscricao" class="form-control" />
            </div>
            <div class="form-group" style="width:100px;">
              <label for="oab_uf">UF</label>
              <select id="oab_uf" name="oab_uf" class="form-control">
                <option value="">--</option>
                <option>AC</option><option>AL</option><option>AP</option>
                <option>AM</option><option>BA</option><option>CE</option>
                <option>DF</option><option>ES</option><option>GO</option>
                <option>MA</option><option>MT</option><option>MS</option>
                <option>MG</option><option>PA</option><option>PB</option>
                <option>PR</option><option>PE</option><option>PI</option>
                <option>RJ</option><option>RN</option><option>RS</option>
                <option>RO</option><option>RR</option><option>SC</option>
                <option>SP</option><option>SE</option><option>TO</option>
              </select>
            </div>
          </div>
        </div>

        <div class="row" style="gap:14px;">
          <div class="form-group" style="flex:1; min-width:200px;">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" class="form-control" required />
          </div>
          <div class="form-group" style="flex:1; min-width:200px;">
            <label for="senha2">Confirmar senha</label>
            <input type="password" id="senha2" name="senha2" class="form-control" required />
          </div>
        </div>

        <div class="form-group" style="font-size:13px; color:var(--text-muted);">
          <label style="display:flex; gap:8px; align-items:flex-start;">
            <input type="checkbox" required style="margin-top:3px;" />
            <span>Li e aceito os <a href="termos.html">Termos de Uso</a> e a <a href="privacidade.html">Política de Privacidade</a>.</span>
          </label>
        </div>

        <div id="msg-erro" class="alert alert-erro" style="display:none; margin-bottom:16px;"></div>

        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>

      </form>

      <p class="auth-footer">
        Já tem uma conta? <a href="login.html">Entrar</a>
      </p>

    </div>
  </div>

  <script>
    function toggleOab() {
      const tipo       = document.getElementById('tipo').value;
      const bloco      = document.getElementById('oab-block');
      const inscricao  = document.getElementById('inscricao');

      if (tipo === 'advogado' || tipo === 'estagiario') {
        bloco.style.display = 'block';
        inscricao.setAttribute('required', 'required');
      } else {
        bloco.style.display = 'none';
        inscricao.removeAttribute('required');
        inscricao.value = '';
      }
    }

    function mostrarMensagem(el, texto, tipo) {
      el.textContent  = texto;
      el.style.display = 'block';

      if (tipo === 'sucesso') {
        el.style.background = 'rgba(32,184,154,.12)';
        el.style.color      = 'var(--teal-dark)';
        el.style.border     = '1px solid rgba(32,184,154,.3)';
      } else {
        el.style.background = 'rgba(224,86,86,.12)';
        el.style.color      = 'var(--danger)';
        el.style.border     = '1px solid rgba(224,86,86,.3)';
      }

      setTimeout(() => {
        el.style.transition = 'opacity 0.5s';
        el.style.opacity    = '0';
        setTimeout(() => el.style.display = 'none', 500);
      }, 5000);
    }

    window.onload = function () {
      toggleOab();

      const params = new URLSearchParams(window.location.search);
      const erro   = params.get('erro');
      const el     = document.getElementById('msg-erro');

      if (erro) mostrarMensagem(el, erro, 'erro');

      window.history.replaceState({}, document.title, window.location.pathname);
    };
  </script>

</body>
</html>
