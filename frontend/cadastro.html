<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=login.html?cadastro">
  <title>Cadastro | JusTraduz</title>
  <link rel="icon" href="assets/img/icon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#008f80">
  <link rel="stylesheet" href="assets/css/style.css?v=theme-slow-3">
  <link rel="stylesheet" href="assets/css/auth-novo.css?v=modulo-1">
</head>
<body>
  <main class="auth-page auth-redirect-page">
    <section class="auth-panel">
      <a class="auth-brand" href="index.html">
        <img src="assets/img/logo.png" alt="JusTraduz">
      </a>
      <div class="auth-card">
        <h1>Cadastro</h1>
        <p class="subtitle">O cadastro agora usa a entrada principal do JusTraduz para manter a experiência consistente.</p>
        <a class="btn btn-primary btn-block" href="login.html?cadastro">Abrir cadastro</a>
        <p class="auth-footer">Ja tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </section>
  </main>
  <script>
    window.location.replace("login.html?cadastro");
  </script>
  <script src="assets/js/accessibility.js?v=2026.06.16-a11y-stack-7"></script>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    if (!window.JusTraduzVlibrasStarted && window.VLibras && window.VLibras.Widget) {
      window.JusTraduzVlibrasStarted = true;
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    }
  </script>
</body>
</html>
