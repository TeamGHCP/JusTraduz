# Modelo Apache para producao do JusTraduz.
# Ajuste ServerName, caminhos e certificados antes de habilitar.

<VirtualHost *:80>
    ServerName seudominio.com.br
    Redirect permanent / https://seudominio.com.br/
</VirtualHost>

<VirtualHost *:443>
    ServerName seudominio.com.br
    DocumentRoot "C:/xampp/htdocs/JusTraduz"

    SSLEngine on
    SSLCertificateFile "C:/certs/seudominio/fullchain.pem"
    SSLCertificateKeyFile "C:/certs/seudominio/privkey.pem"

    <Directory "C:/xampp/htdocs/JusTraduz">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"

    ErrorLog "logs/justraduz-error.log"
    CustomLog "logs/justraduz-access.log" combined
</VirtualHost>
